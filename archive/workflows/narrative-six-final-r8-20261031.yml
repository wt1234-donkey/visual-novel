name: Complete six pending studio narrative entries R8
on:
  push:
    branches:
      - editorial/six-final-narrative-r8-20261031
    paths:
      - data/narrative-six-final-r8-20261031.json
      - scripts/complete_six_final_narrative_r8_20261031.py
      - tests/test_narrative_editorial.py
      - .github/workflows/narrative-six-final-r8-20261031.yml
permissions:
  contents: write
concurrency:
  group: narrative-six-final-r8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fill-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply six evidence-scoped narrative entries
        run: python3 scripts/complete_six_final_narrative_r8_20261031.py
      - name: Audit remaining four-field catalogue gaps
        run: python3 scripts/audit_narrative_pending_20261030.py
      - name: Validate game corpus and historical/provenance tests
        run: |
          python3 scripts/validate_narrative_editorial.py
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Commit validated editorial and remaining-work audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-editorial.json data/narrative-pending-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply six verified studio narrative annotations and gap audit"
            git fetch origin editorial/six-final-narrative-r8-20261031
            git rebase origin/editorial/six-final-narrative-r8-20261031
            git push origin HEAD:editorial/six-final-narrative-r8-20261031
          fi
