name: Project studio title-year backfill and validation
on:
  push:
    branches:
      - catalog/title-year-backfill-20261031
    paths:
      - data/project-title-year-candidates-20261031.json
      - scripts/backfill_project_title_years_20261031.py
      - scripts/audit_narrative_pending_20261030.py
      - tests/test_narrative_editorial.py
      - tests/filter.test.mjs
      - tests/test_broderbund_completion_20261029.py
      - .github/workflows/project-title-year-backfill-20261031.yml
permissions:
  contents: write
concurrency:
  group: project-title-year-backfill-20261031
  cancel-in-progress: true
jobs:
  dedupe-import-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deduplicate studio products by original title and append only new identities
        run: python3 scripts/backfill_project_title_years_20261031.py
      - name: Regenerate release tables, site metadata, and separate title-year audit
        run: |
          python3 scripts/sync_versions_csv.py
          python3 scripts/export_content_csv.py
          python3 scripts/export_interaction_csv.py
          python3 scripts/build_entity_model.py
          python3 scripts/build_entity_pages.py
          python3 scripts/build_relationships_preview.py
          python3 scripts/build_company_pages.py
          python3 scripts/audit_narrative_pending_20261030.py
      - name: Run complete database and historical regression verification
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Save verified work names, years and generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html catalogue.html entities.html organizations.html
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Add verified studio game titles and debut years without editorial profiles"
            git fetch origin catalog/title-year-backfill-20261031
            git rebase origin/catalog/title-year-backfill-20261031
            git push origin HEAD:catalog/title-year-backfill-20261031
          fi
