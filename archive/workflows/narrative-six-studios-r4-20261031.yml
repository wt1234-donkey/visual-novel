name: Audit and complete six-studio narrative metadata R4
on:
  push:
    branches:
      - editorial/six-studios-r4-20261031
    paths:
      - data/narrative-evidence-six-studios-r4-20261031.json
      - scripts/complete_narrative_fields_six_studios_r4_20261031.py
      - scripts/validate_narrative_editorial.py
      - tests/test_narrative_editorial.py
      - .github/workflows/narrative-six-studios-r4-20261031.yml
permissions:
  contents: write
concurrency:
  group: narrative-six-studios-r4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply-test-save:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply title-specific story evidence
        run: python3 scripts/complete_narrative_fields_six_studios_r4_20261031.py
      - name: Re-audit all four-field gaps
        run: python3 scripts/audit_narrative_pending_20261030.py
      - name: Validate provenance, catalogue, and history
        run: |
          python3 scripts/validate_narrative_editorial.py
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Save validated records and pending-work summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-editorial.json data/narrative-pending-*.json
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified narrative evidence to six studio catalogues"
            git push origin HEAD:editorial/six-studios-r4-20261031
          fi
