name: Import and verify basic rounds 86 and 87 with queue priority
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'scripts/import_basic_r86_r87_20261102.py'
      - '.github/workflows/basic-r86-r87-20261102.yml'
      - 'scripts/import_basic_r60_r61_20261102.py'
      - 'scripts/import_basic_r24_r25_20261101.py'
      - 'scripts/import_basic_r22_cont_r23_20261101.py'
      - 'scripts/import_basic_r20_r21_20261101.py'
      - 'scripts/import_basic_r50_r51_20261101.py'
      - 'scripts/basic_source_date_review.py'
      - 'scripts/ifdb_archive_identity.py'
      - 'scripts/import_nextmoe_basic_20261101_r2.py'
      - 'tests/test_basic_source_date_review.py'
      - 'tests/test_ifdb_archive_resume.py'
      - 'tests/test_ifdb_archive_identity.py'
      - 'tests/test_main_adv_rpg_registry_20261031.py'
permissions:
  contents: write
concurrency:
  group: basic-r86-r87-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  import-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'catalog/basic-r86-r87-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recheck 286 saved candidates, append two 500-identity batches and verify provenance
        run: |
          python3 -m py_compile scripts/import_basic_r86_r87_20261102.py
          python3 scripts/import_basic_r86_r87_20261102.py
          python3 scripts/import_basic_r86_r87_20261102.py --check
          python3 scripts/stage_basic_registry_for_main.py --offset 0 --limit 100 --write
      - name: Required catalogue, entity, regression and page checks
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
      - name: Commit verified basic identities to this PR
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/main-adv-rpg-works-20261031.json data/vndb-kana-bulk-review-20261102-r86.json data/nextmoe-ifdb-bulk-review-20261102-r87.json data/basic-r86-r87-diversity-20261102.json data/basic-to-full-promotion-review-20261101.json
          if ! git diff --cached --quiet; then
            git commit -m "Append audited basic rounds 86 and 87 with IFDB supplementation"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
