name: Verify and stage historical western and Japanese AVG identities
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'data/historical-western-jp-*-20261101.json'
      - 'scripts/import_historical_western_jp_20261101.py'
      - '.github/workflows/historical-western-jp-20261101.yml'
permissions:
  contents: write
concurrency:
  group: historical-western-jp-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-and-stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'catalog/90s-western-early-japan-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reproduce reviewed identities and evidence audit
        run: |
          python3 scripts/import_historical_western_jp_20261101.py
          python3 scripts/import_historical_western_jp_20261101.py --check
          git diff --exit-code -- data/historical-western-jp-audit-20261101.json docs/historical-western-jp-20261101.md
      - name: Required catalogue and regression checks
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Stage the verified registry on this PR branch
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/main-adv-rpg-works-20261031.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage 23 audited historical AVG identities"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
