name: Review and promote 59 story-first ADV RPG studio works
on:
  push:
    branches: [catalog/next-narrative-studios-20261031]
    paths:
      - data/adv-rpg-next-studio-candidates-20261031.json
      - scripts/promote_next_narrative_studios_20261031.py
      - tests/test_next_narrative_studio_main_20261031.py
      - tests/test_main_adv_rpg_registry_20261031.py
      - minimal-adv-rpg.mjs
      - .github/workflows/next-narrative-studios-20261031.yml
permissions:
  contents: write
concurrency:
  group: next-studio-adv-rpg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Match 59 works to complete / company / first-round identities
        run: python3 scripts/promote_next_narrative_studios_20261031.py
      - name: Verify deduplication and website integration; preserve corpus
        run: |
          python3 -m unittest discover -s tests -p "test_next_narrative_studio_main_20261031.py"
          python3 -m unittest discover -s tests -p "test_main_adv_rpg_registry_20261031.py"
          python3 -m unittest discover -s tests -p "test_minimal_adv_rpg_index_20261031.py"
          node --check discovery.mjs
          node --check minimal-adv-rpg.mjs
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Write approved main identity layer and evidence report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/main-adv-rpg-works-20261031.json data/adv-rpg-next-studio-review-20261031.json data/adv-rpg-next-studio-review-20261031.md
          if ! git diff --cached --quiet; then
            git commit -m "Register screened narrative-first studio games without duplicate identity"
            git fetch origin catalog/next-narrative-studios-20261031
            git rebase origin/catalog/next-narrative-studios-20261031
            git push origin HEAD:catalog/next-narrative-studios-20261031
          fi
