name: Publish verified static website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-pages-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate catalogue and existing regressions
        run: |
          python3 scripts/generate_effective_views.py
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node scripts/migrate_basic_storage.mjs --check
          python3 scripts/registry_store.py --check
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
      - name: Install isolated browser regression dependency
        run: |
          npm install --prefix /tmp/catalogue-browser --no-package-lock --no-audit --no-fund playwright@1.56.1
          /tmp/catalogue-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify cross-release recovery in Chromium
        env:
          PLAYWRIGHT_MODULE: /tmp/catalogue-browser/node_modules/playwright
        run: node --test tests/browser/*.test.mjs
      - name: Build static artifact and provenance manifest
        run: python3 scripts/build_pages_artifact.py --output _site
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 14
