name: Publish verified static website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/build_pages_artifact.py'
      - 'tests/test_pages_artifact.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate catalogue and existing regressions
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
      - name: Build static artifact and provenance manifest
        run: python3 scripts/build_pages_artifact.py --output _site
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified main artifact
        id: deployment
        uses: actions/deploy-pages@v4
