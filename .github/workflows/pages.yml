name: Publish verified static website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [catalogue-release-request]
permissions:
  contents: read
concurrency:
  group: verified-pages-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate catalogue and existing regressions
        run: python3 scripts/validate_catalogue.py
      - name: Retain capability and conditional coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: current-test-capabilities
          path: test-results/*.json
      - name: Install isolated browser regression dependency
        run: |
          npm install --prefix /tmp/catalogue-browser --no-package-lock --no-audit --no-fund playwright@1.56.1
          /tmp/catalogue-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify cross-release recovery in Chromium
        env:
          PLAYWRIGHT_MODULE: /tmp/catalogue-browser/node_modules/playwright
        run: node --test tests/browser/field-evidence.test.mjs tests/browser/formal-audit.test.mjs tests/browser/release-recovery.test.mjs tests/browser/source-identities.test.mjs
      - name: Build static artifact and provenance manifest
        run: python3 scripts/build_pages_artifact.py --workspace "$RUNNER_TEMP/catalogue-build" --output _site
      - name: Verify published entrypoints against the actual artifact
        env:
          PLAYWRIGHT_MODULE: /tmp/catalogue-browser/node_modules/playwright
          ATLAS_SITE_DIRECTORY: _site
        run: node --test tests/browser/published-pages.test.mjs
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 14
  request-deployment:
    needs: build
    if: github.event_name == 'repository_dispatch' && github.event.action == 'catalogue-release-request' && github.repository == 'wt1234-donkey/visual-novel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Request separate serialized deployment of this verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/request_pages_deployment.py
