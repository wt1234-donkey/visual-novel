name: Basic registry rounds 20-21 — VNDB continuation and NextMoe page 93+
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: basic-r20-r21-20261101
  cancel-in-progress: true
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile importer before data changes
        run: python3 -m py_compile scripts/import_basic_r20_r21_20261101.py
      - name: Import VNDB continuation then NextMoe continuation
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/import_basic_r20_r21_20261101.py --max-new 500 --vndb-pages 250 --nextmoe-start-page 93 --nextmoe-pages 150 --delay 1.2 2>&1 | tee /tmp/r20-r21.log
      - name: Refresh strict main-registry upgrade audit queue
        run: python3 scripts/stage_basic_registry_for_main.py --offset 0 --limit 100 --write
      - name: Audit decade and developer diversity without promoting creator credits
        run: python3 scripts/audit_basic_r20_r21_diversity.py
      - name: Audit source IDs, VNDB IDs, names, aliases, years and cross-round uniqueness
        run: |
          python3 - <<'PY'
          import json, re, unicodedata
          from pathlib import Path
          def load(path): return json.loads(Path(path).read_text(encoding="utf-8"))
          def norm(value):
              return "".join(c for c in unicodedata.normalize("NFKC", str(value or "")).casefold() if c.isalnum())
          registry = load("data/main-adv-rpg-works-20261031.json")
          assert registry["summary"]["accepted"] == len(registry["works"])
          assert len({w["id"] for w in registry["works"]}) == len(registry["works"])
          assert len({w["indexId"] for w in registry["works"]}) == len(registry["works"])
          all_vndb = [ref for w in registry["works"] for ref in w.get("sourceRefs", []) if str(ref).startswith("vndb:v")]
          assert len(all_vndb) == len(set(all_vndb)), "VNDB ID duplicated in registry"
          expected = 9810
          batches = [
              (20, "vndb-kana-bulk-20261101-r20", "data/vndb-kana-bulk-review-20261101-r20.json", "vndb-20261101-r20-", "vndb"),
              (21, "nextmoe-galgame-bulk-20261101-r21", "data/nextmoe-bulk-review-20261101-r21.json", "nextmoe-20261101-r21-", "nextmoe"),
          ]
          new_ids, new_vndb_ids, new_source_ids = set(), set(), set()
          new_name_years, prior_name_years = set(), set()
          target_batches = {batch[1] for batch in batches}
          for work in registry["works"]:
              if work.get("batch") in target_batches:
                  continue
              year = work.get("firstYear")
              for name in [work.get("title"), *(work.get("aliases") or [])]:
                  key = norm(name) + "|" + str(year)
                  if norm(name) and year:
                      prior_name_years.add(key)
          for number, batch_id, path, index_prefix, source_kind in batches:
              audit = load(path)
              batch = next(item for item in registry["batches"] if item["id"] == batch_id)
              works = [w for w in registry["works"] if w.get("batch") == batch_id]
              count = audit["summary"]["newDistinctWorks"]
              assert 0 < count <= 500
              assert count == len(works) == len(audit["records"]) == batch["summary"]["promoted-basic"]
              assert audit["summary"]["before"] == expected
              assert audit["summary"]["after"] == expected + count
              assert batch["review"] == path
              assert len({row["sourceId"] for row in audit["records"]}) == count
              assert len({row["vndbId"] for row in audit["records"]}) == count
              for row in audit["records"]:
                  work = next(item for item in works if item["id"] == row["id"])
                  assert work["indexId"].startswith(index_prefix)
                  assert work["title"] == row["title"]
                  assert work["aliases"] == row["aliases"]
                  assert work["firstYear"] == row["firstYear"]
                  assert "vndb:" + row["vndbId"] in work.get("sourceRefs", [])
                  if source_kind == "vndb":
                      assert row["sourceId"] == row["vndbId"]
                      assert re.fullmatch(r"v\d+", row["vndbId"])
                      assert work["id"] == "vndb-" + row["vndbId"]
                  else:
                      assert str(row["sourceId"]).isdecimal()
                      assert re.fullmatch(r"v\d+", row["vndbId"])
                      assert work["id"] == "nextmoe-" + str(row["sourceId"])
                      assert "nextmoe:" + str(row["sourceId"]) in work.get("sourceRefs", [])
                  assert row["id"] not in new_ids
                  assert row["vndbId"] not in new_vndb_ids
                  assert (source_kind, str(row["sourceId"])) not in new_source_ids
                  new_ids.add(row["id"])
                  new_vndb_ids.add(row["vndbId"])
                  new_source_ids.add((source_kind, str(row["sourceId"])))
                  keys = {norm(name) + "|" + str(row["firstYear"])
                          for name in [row["title"], *(row.get("aliases") or [])] if norm(name)}
                  assert not (keys & prior_name_years), "New record duplicates existing title/alias + year"
                  assert not (keys & new_name_years), "Cross-round title/alias + year duplicate"
                  new_name_years.update(keys)
              print("ROUND", number, "NEW", count, "SCANNED", audit["summary"]["scanned"], "TOTAL", expected + count)
              expected += count
          assert expected == len(registry["works"])
          assert len(registry["works"]) == 10810
          assert registry["summary"]["addedToMainIdentityLayer"] == registry["summary"]["promotedBasic"] + registry["summary"]["promotedDossier"]
          promotion = load("data/basic-to-full-promotion-review-20261101.json")
          assert promotion["summary"]["registryAccepted"] == expected
          assert all(row["readyForStrictGamesJson"] is False for row in promotion["records"])
          diversity = load("data/basic-r20-r21-diversity-audit-20261101.json")
          assert diversity["summary"]["records"] == 1000
          assert diversity["summary"]["uniqueVndbIds"] == 1000
          assert sum(diversity["summary"]["decades"].values()) == 1000
          print("ALL_CHECKS_PASSED", expected, "DEVELOPER_IDS", diversity["summary"]["uniqueDeveloperProducerIds"])
          PY
      - name: Run complete strict data, entity, Python, Node and website tests
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          node --check discovery.mjs
      - name: Commit audited batches to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/main-adv-rpg-works-20261031.json data/vndb-kana-bulk-review-20261101-r20.json data/nextmoe-bulk-review-20261101-r21.json data/basic-to-full-promotion-review-20261101.json data/basic-r20-r21-diversity-audit-20261101.json data/supplemental-game-catalogue-sources-20261101.md
          if ! git diff --cached --quiet; then
            git commit -m "Append basic identity rounds 20 and 21"
            git fetch origin "$GITHUB_HEAD_REF"
            git rebase "origin/$GITHUB_HEAD_REF"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi
