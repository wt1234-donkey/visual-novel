name: Basic registry rounds 18-19 — VNDB continuation and NextMoe deeper catalog
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: basic-r18-r19-20261101
  cancel-in-progress: true
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile import code before data changes
        run: python3 -m py_compile scripts/import_basic_r18_r19_20261101.py
      - name: Import VNDB continuation then NextMoe continuation
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/import_basic_r18_r19_20261101.py --max-new 500 --vndb-pages 250 --nextmoe-start-page 86 --nextmoe-pages 100 --delay 1.2 2>&1 | tee /tmp/r18-r19.log
      - name: Refresh strict main-registry upgrade audit queue
        run: python3 scripts/stage_basic_registry_for_main.py --offset 0 --limit 100 --write
      - name: Audit source IDs, VNDB IDs, names, aliases, years and cross-round uniqueness
        run: |
          python3 - <<'PY'
          import json, re, unicodedata
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text(encoding="utf-8"))
          def norm(s):
              return "".join(c for c in unicodedata.normalize("NFKC", str(s or "")).casefold() if c.isalnum())
          r=load('data/main-adv-rpg-works-20261031.json')
          assert r['summary']['accepted']==len(r['works'])
          assert len({w['id'] for w in r['works']})==len(r['works'])
          assert len({w['indexId'] for w in r['works']})==len(r['works'])
          all_vndb=[s for w in r['works'] for s in w.get('sourceRefs',[]) if str(s).startswith('vndb:v')]
          assert len(all_vndb)==len(set(all_vndb)), 'VNDB ID duplicated in registry'
          expected=8810
          batches=[
            (18,'vndb-kana-bulk-20261101-r18','data/vndb-kana-bulk-review-20261101-r18.json','vndb-20261101-r18-','vndb'),
            (19,'nextmoe-galgame-bulk-20261101-r19','data/nextmoe-bulk-review-20261101-r19.json','nextmoe-20261101-r19-','nextmoe')
          ]
          new_ids=set()
          new_vndb_ids=set()
          new_source_ids=set()
          new_name_years=set()
          prior_name_years=set()
          for w in r['works']:
              if w.get('batch') in {b[1] for b in batches}:
                  continue
              year=w.get('firstYear')
              for name in [w.get('title'),*(w.get('aliases') or [])]:
                  key=norm(name)+'|'+str(year)
                  if norm(name) and year: prior_name_years.add(key)
          for n,batch,path,index_prefix,source_kind in batches:
              a=load(path)
              b=next(x for x in r['batches'] if x['id']==batch)
              works=[w for w in r['works'] if w.get('batch')==batch]
              inc=a['summary']['newDistinctWorks']
              assert 0<inc<=500 and inc==len(works)==len(a['records'])==b['summary']['promoted-basic']
              assert a['summary']['before']==expected and a['summary']['after']==expected+inc
              assert b['review']==path
              assert len({x['sourceId'] for x in a['records']})==inc
              assert len({x['vndbId'] for x in a['records']})==inc
              for record in a['records']:
                  w=next(x for x in works if x['id']==record['id'])
                  assert w['indexId'].startswith(index_prefix)
                  assert w['title']==record['title'] and w['aliases']==record['aliases'] and w['firstYear']==record['firstYear']
                  assert record['vndbId'] in [s.split(':',1)[1] for s in w.get('sourceRefs',[]) if s.startswith('vndb:')]
                  if source_kind=='vndb':
                      assert record['sourceId']==record['vndbId'] and re.fullmatch(r'v\d+',record['vndbId'])
                      assert w['id']=='vndb-'+record['vndbId']
                  else:
                      assert str(record['sourceId']).isdecimal() and re.fullmatch(r'v\d+',record['vndbId'])
                      assert w['id']=='nextmoe-'+str(record['sourceId'])
                  assert record['id'] not in new_ids
                  assert record['vndbId'] not in new_vndb_ids
                  new_ids.add(record['id']);new_vndb_ids.add(record['vndbId']);new_source_ids.add((source_kind,str(record['sourceId'])))
                  keys={norm(name)+'|'+str(record['firstYear']) for name in [record['title'],*(record.get('aliases') or [])] if norm(name)}
                  assert not (keys & prior_name_years), 'New batch duplicated existing name/alias + year'
                  assert not (keys & new_name_years), 'Cross-round name/alias + year duplicate'
                  new_name_years.update(keys)
              print('ROUND',n,'NEW',inc,'SCANNED',a['summary']['scanned'],'TOTAL',expected+inc)
              expected+=inc
          assert len(r['works'])==expected
          assert r['summary']['addedToMainIdentityLayer']==r['summary']['promotedBasic']+r['summary']['promotedDossier']
          q=load('data/basic-to-full-promotion-review-20261101.json')
          assert q['summary']['registryAccepted']==expected
          assert all(x['readyForStrictGamesJson'] is False for x in q['records'])
          print('ALL_CHECKS_PASSED',expected)
          PY
      - name: Run complete strict data, entity, Python, Node and website tests
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          node --check discovery.mjs
      - name: Commit audited batches to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/main-adv-rpg-works-20261031.json data/vndb-kana-bulk-review-20261101-r18.json data/nextmoe-bulk-review-20261101-r19.json data/basic-to-full-promotion-review-20261101.json
          if ! git diff --cached --quiet; then
            git commit -m "Append basic identity rounds 18 and 19"
            git fetch origin "$GITHUB_HEAD_REF"
            git rebase "origin/$GITHUB_HEAD_REF"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi
