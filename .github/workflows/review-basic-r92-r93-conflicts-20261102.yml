name: Verify and register reviewed round 92-93 conflict identities
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
    paths:
      - 'scripts/review_basic_r92_r93_conflicts_20261102.py'
      - 'scripts/basic_identity_decisions.py'
      - 'data/basic-r92-r93-conflict-review-20261102.json'
      - '.github/workflows/review-basic-r92-r93-conflicts-20261102.yml'
permissions:
  contents: write
concurrency:
  group: review-r92-r93-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'catalog/review-r92-r93-conflicts-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply explicit reviewed identities and preserve old evidence
        run: |
          python3 scripts/review_basic_r92_r93_conflicts_20261102.py
          python3 scripts/review_basic_r92_r93_conflicts_20261102.py --check
          python3 scripts/stage_basic_registry_for_main.py --offset 0 --limit 100 --write
      - name: Required catalogue, entity, Python, Node and generation checks
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
      - name: Commit verified identities to this pull request
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/main-adv-rpg-works-20261031.json data/basic-to-full-promotion-review-20261101.json
          if ! git diff --cached --quiet; then
            git commit -m "Register 56 reviewed distinct works and preserve unresolved candidates"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
