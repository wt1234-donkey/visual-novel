name: Expand six non-RPG narrative studio catalogues (2026-10-30)

on:
  push:
    branches:
      - catalog/six-studios-non-rpg-expansion-20261030
    paths:
      - data/non-rpg-six-studios-expansion-20261030.json
      - scripts/apply_six_studios_expansion_20261030.py
      - .github/workflows/non-rpg-18-studios-intake.yml
      - scripts/apply_non_rpg_intake_20261030.py
      - scripts/build_entity_model.py
      - scripts/preserve_historical_entity_evidence.py
      - tests/test_broderbund_completion_20261029.py
      - tests/test_chunsoft_completion_20261029.py
      - tests/test_narrative_editorial.py
      - tests/test_creator_u1_review.py
      - tests/test_creator_v1_review.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Import additional independent non-RPG narratives
        run: python3 scripts/apply_six_studios_expansion_20261030.py
      - name: Export derived catalogues
        run: |
          python3 scripts/sync_versions_csv.py
          python3 scripts/export_content_csv.py
          python3 scripts/export_interaction_csv.py
          python3 scripts/build_entity_model.py
          python3 scripts/build_entity_pages.py
          python3 scripts/build_relationships_preview.py
          python3 scripts/build_company_pages.py
      - name: Validate catalogue and tests
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Commit validated generated data to intake branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html catalogue.html entities.html organizations.html
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Generate and validate non-RPG catalogue additions (2026-10-30)"
            git push origin HEAD:catalog/six-studios-non-rpg-expansion-20261030
          fi
