name: Import and verify IFDB and PC-98 basic rounds 138 and 139
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'scripts/import_basic_r138_r139_20261103.py'
      - 'scripts/import_basic_r134_r135_20261103.py'
      - 'scripts/ifdb_archive_identity.py'
      - 'tests/test_ifdb_exhaustion_resume_20261103.py'
      - 'data/pc98-admission-review-r138-r139-20261103.json'
      - 'tests/test_ifdb_pc98_intake_20261103.py'
      - '.github/workflows/basic-r138-r139-20261103.yml'
permissions:
  contents: write
concurrency:
  group: basic-r138-r139-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  import-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'catalog/basic-r138-r139-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resume IFDB 12711 and review PC-98 pending rows, with a 500-work cap per batch
        run: |
          python3 -m py_compile scripts/import_basic_r138_r139_20261103.py scripts/collect_pc98_catalogues_20261103.py
          python3 scripts/collect_pc98_catalogues_20261103.py --check
          python3 scripts/import_basic_r138_r139_20261103.py --rebuild
          python3 scripts/import_basic_r138_r139_20261103.py --check
          python3 scripts/stage_basic_registry_for_main.py --offset 0 --limit 100 --write
      - name: Required catalogue, entity, regression and page checks
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
      - name: Commit verified basic identities to this PR
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/main-adv-rpg-works-20261031.json data/pc98-catalogue-audit-r138-r139-20261103.json data/ifdb-pc98-bulk-review-20261103-r138.json data/ifdb-pc98-bulk-review-20261103-r139.json data/basic-r138-r139-audit-summary-20261103.md data/basic-to-full-promotion-review-20261101.json
          if ! git diff --cached --quiet; then
            git commit -m "Append audited basic rounds 138 and 139 from IFDB and reviewed PC-98 catalogues"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
