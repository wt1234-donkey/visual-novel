name: Import and validate recommended non-RPG narrative games

on:
  push:
    branches:
      - catalog/recommended-narrative-works-20261030
    paths:
      - data/non-rpg-recommended-intake-20261030.json
      - scripts/apply_recommended_narratives_20261030.py
      - .github/workflows/recommended-narrative-intake-20261030.yml
      - tests/test_broderbund_completion_20261029.py
      - tests/test_narrative_editorial.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Add original non-RPG narrative work identities
        run: python3 scripts/apply_recommended_narratives_20261030.py
      - name: Rebuild derived catalogue, creator links and pages
        run: |
          python3 scripts/sync_versions_csv.py
          python3 scripts/export_content_csv.py
          python3 scripts/export_interaction_csv.py
          python3 scripts/build_entity_model.py
          python3 scripts/build_entity_pages.py
          python3 scripts/build_relationships_preview.py
          python3 scripts/build_company_pages.py
      - name: Validate catalogue and regression tests
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Save generated validated records to recommendation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html catalogue.html entities.html organizations.html
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Import validated recommended narrative works (2026-10-30)"
            git push origin HEAD:catalog/recommended-narrative-works-20261030
          fi
