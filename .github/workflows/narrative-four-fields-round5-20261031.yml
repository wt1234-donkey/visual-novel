name: Verify round-five narrative evidence and audit
on:
  push:
    branches:
      - editorial/four-fields-round3-20261031
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/complete_narrative_fields_round3_20261031.py
      - run: python3 scripts/audit_narrative_pending_20261030.py
      - run: |
          python3 scripts/validate_narrative_editorial.py
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Save generated edits and refreshed audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-editorial.json data/narrative-pending-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply four-field evidence to remaining narrative profiles"
            git fetch origin editorial/four-fields-round3-20261031
            git rebase origin/editorial/four-fields-round3-20261031
            git push origin HEAD:editorial/four-fields-round3-20261031
          fi
