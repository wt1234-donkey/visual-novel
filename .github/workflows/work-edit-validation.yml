name: 网页作品编辑与回撤校验
on:
  push:
    branches: [main]
    paths:
      - 'data/work-edit-history.json'
      - 'work-edit-*.mjs'
      - 'live-work-editor*'
      - 'scripts/validate_work_edits.py'
  pull_request:
    paths:
      - 'data/work-edit-history.json'
      - 'work-edit-*.mjs'
      - 'live-work-editor*'
      - 'scripts/validate_work_edits.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_work_edits.py
      - run: node --test tests/work-edit.test.mjs
