name: Audit missing four-field narrative metadata
on:
  push:
    branches:
      - editorial/four-fields-evidence-20261030
    paths:
      - scripts/audit_narrative_pending_20261030.py
      - scripts/complete_narrative_fields_20261030.py
      - data/narrative-evidence-patches-20261030.json
      - .github/workflows/narrative-four-fields-20261030.yml
permissions:
  contents: write
jobs:
  audit-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Produce pending work audit
        run: python3 scripts/audit_narrative_pending_20261030.py
      - name: Apply evidenced four-field editorial revisions
        run: |
          if [ -f scripts/complete_narrative_fields_20261030.py ]; then
            python3 scripts/complete_narrative_fields_20261030.py
          fi
          python3 scripts/audit_narrative_pending_20261030.py
      - name: Verify narrative and full catalogue tests
        run: |
          python3 scripts/validate_narrative_editorial.py
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Commit validated audit and editorial changes to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-editorial.json data/narrative-pending-*.json
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Record validated narrative field evidence and remaining gaps"
            git push origin HEAD:editorial/four-fields-evidence-20261030
          fi
