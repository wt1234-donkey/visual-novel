name: Apply audited ELF additions
on:
  push:
    branches: [elf-content-audit-20261021]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Run ELF patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and regenerate
        run: |
          python3 scripts/patch_elf_20261021.py
          python3 scripts/sync_versions_csv.py
          python3 scripts/export_content_csv.py
          python3 scripts/export_interaction_csv.py
          python3 scripts/build_company_pages.py
      - name: Validate
        run: |
          python3 scripts/validate_data.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/company-coverage.json data/elf-20261021-audit.md data/content-versions.csv data/platform-releases.csv data/versions.csv data/content-review.csv data/interaction-modes.csv elf.html
          git commit -m "Update ELF content versions and Wonderland titles" || true
          git push
