name: Append 3370 IFDB rows in paired batches 199-205
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ifdb-append-20261104.yml'
      - 'scripts/import_ifdb_append_20261104.py'
      - 'data/ifdb-append-source-20261104.json.gz.b64'
      - 'data/ifdb-append-manifest-20261104.json'
      - 'tests/test_ifdb_append_20261104.py'
      - 'tests/test_main_adv_rpg_registry_20261031.py'
      - 'scripts/basic_identity_decisions.py'
      - 'scripts/review_basic_r118_r119_last20_20261102.py'
      - 'tests/test_basic_r118_r119_last20_20261102.py'
      - 'tests/test_basic_r92_r93_conflict_review.py'
permissions:
  contents: read
concurrency:
  group: ifdb-append-20261104
  cancel-in-progress: false
jobs:
  intake:
    if: github.head_ref == 'catalog/ifdb-append-3370-20261104' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Append paired batches, one commit per group
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          for pair in range(1,5):
              subprocess.run(['python3','scripts/import_ifdb_append_20261104.py','--pair',str(pair)],check=True)
              subprocess.run(['git','add','data/main-adv-rpg-works-20261031.json',*[str(p) for p in Path('data').glob('ifdb-append-review-20261104-r*.json')]],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode:
                  first=199+(pair-1)*2
                  subprocess.run(['git','commit','-m',f'Append IFDB batches {first}-{min(first+1,205)} without deduplication'],check=True)
          PY
      - name: Verify source accounting and unchanged original records
        run: python3 scripts/import_ifdb_append_20261104.py --check
      - name: Refresh catalogue indexes and dossiers
        run: |
          python3 scripts/sync_versions_csv.py
          python3 scripts/export_content_csv.py
          python3 scripts/export_interaction_csv.py
          python3 scripts/build_entity_model.py
          python3 scripts/build_entity_pages.py
          python3 scripts/build_company_pages.py
          python3 scripts/stage_basic_registry_for_main.py --offset 0 --limit 100 --write
      - name: Validate Python Node and data integrity
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
      - name: Push verified data back to the PR branch
        run: |
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh indexes after IFDB paired intake'
          fi
          git push origin HEAD:${{ github.head_ref }}
