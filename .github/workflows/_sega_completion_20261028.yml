name: Complete reviewed SEGA catalogue
on:
  push:
    branches: [codex/sega-catalogue-completion-20261028]
    paths: [scripts/_apply_sega_completion_20261028.py]
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply source and regenerate indexes and pages
        run: |
          python3 scripts/_apply_sega_completion_20261028.py
          python3 scripts/sync_versions_csv.py
          python3 scripts/export_content_csv.py
          python3 scripts/export_interaction_csv.py
          python3 scripts/build_entity_model.py
          python3 scripts/build_entity_pages.py
          python3 scripts/build_company_pages.py
      - name: Data and complete regression checks
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test --test-concurrency=1 tests/*.test.mjs
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
          python3 scripts/build_company_pages.py --check
          git diff --check
      - name: Commit validated final files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete SEGA narrative and cross-genre catalogue with sourced content boundaries'
          git push origin HEAD:codex/sega-catalogue-completion-20261028
