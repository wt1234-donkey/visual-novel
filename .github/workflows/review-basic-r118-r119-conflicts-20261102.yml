name: Review isolated identities from basic rounds 118 and 119
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'scripts/review_basic_r118_r119_conflicts_20261102.py'
      - '.github/workflows/review-basic-r118-r119-conflicts-20261102.yml'
      - 'data/vndb-kana-bulk-review-20261102-r118.json'
      - 'data/nextmoe-ifdb-bulk-review-20261102-r119.json'
      - 'data/basic-r118-r119-conflict-evidence-20261102.json'
      - 'data/basic-r118-r119-conflict-evidence-20261102.md'
      - 'tests/test_basic_r118_r119_conflict_evidence.py'
permissions:
  contents: write
concurrency:
  group: review-r118-r119-conflicts-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  evidence-and-regression:
    if: github.event.sender.login != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'catalog/review-r118-r119-conflicts-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect exact VNDB and pinned IFDB source evidence for all 56 identities
        run: |
          python3 -m py_compile scripts/review_basic_r118_r119_conflicts_20261102.py
          python3 scripts/review_basic_r118_r119_conflicts_20261102.py
          python3 scripts/review_basic_r118_r119_conflicts_20261102.py --check
      - name: Validate catalogue, entity model, Python and Node regressions
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
      - name: Commit source evidence report to this PR
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/basic-r118-r119-conflict-evidence-20261102.json data/basic-r118-r119-conflict-evidence-20261102.md
          if ! git diff --cached --quiet; then
            git commit -m "Record source evidence for isolated identities from rounds 118 and 119"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
