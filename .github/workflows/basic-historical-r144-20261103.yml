name: Verify historical narrative basic identities round 144
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/basic-historical-r144-20261103.yml'
      - 'scripts/import_basic_historical_20261103.py'
      - 'data/historical-narrative-intake-20261103.json'
      - 'data/basic-historical-review-20261103-r144.json'
      - 'data/basic-historical-audit-summary-20261103.md'
      - 'data/main-adv-rpg-works-20261031.json'
      - 'data/basic-to-full-promotion-review-20261101.json'
permissions:
  contents: write
concurrency:
  group: basic-historical-r144-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'catalog/basic-historical-1970-1999-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate reviewed identities and stage promotion candidates
        run: |
          python3 scripts/import_basic_historical_20261103.py
          python3 scripts/import_basic_historical_20261103.py --check
          python3 scripts/stage_basic_registry_for_main.py --offset 0 --limit 100 --write
      - name: Check catalogue integrity
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_company_pages.py --check
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_entity_pages.py --check
          git diff --check
      - name: Commit verified generated data
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/main-adv-rpg-works-20261031.json data/basic-to-full-promotion-review-20261101.json data/basic-historical-review-20261103-r144.json data/basic-historical-audit-summary-20261103.md
          if ! git diff --cached --quiet; then
            git commit -m "Append reviewed historical narrative basic identities"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
