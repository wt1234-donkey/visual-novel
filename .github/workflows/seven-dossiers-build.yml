name: Seven dossiers one-shot build
on:
  push:
    branches:
      - automation/seven-dossiers-20261028
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply sourced additions and regenerate
        run: |
          python3 scripts/add_seven_dossiers_20261028.py
          python3 scripts/sync_versions_csv.py
          python3 scripts/export_content_csv.py
          python3 scripts/export_interaction_csv.py
          python3 scripts/build_entity_model.py
          python3 scripts/build_organizations.py
          python3 scripts/build_entity_pages.py
          python3 scripts/build_company_pages.py
          python3 scripts/build_relationships_preview.py
      - name: Validate all catalogues
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_entity_model.py
          python3 scripts/run_python_tests.py
          node --test tests/*.test.mjs
          python3 scripts/build_entity_model.py --check
          python3 scripts/build_organizations.py --check
          python3 scripts/build_entity_pages.py --check
          python3 scripts/build_company_pages.py --check
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build seven company dossiers and catalogue indexes"
            git push
          fi
